services:
  - type: web
    name: schoolos
    runtime: node
    plan: free
    buildCommand: cd backend && npm ci && npm run build
    startCommand: cd backend && npm run start:render
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_BASE_URL
        value: /api
      - key: DATABASE_URL
        sync: false
      - key: DB_CONNECTION_MODE
        value: pooler
      - key: SUPABASE_POOLER_HOST
        value: aws-1-ap-south-1.pooler.supabase.com
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: ENABLE_INSTANT_LOGIN
        value: "true"
      - key: COMMUNICATION_JOBS_ENABLED
        value: "false"
